<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaGuard — Login</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    .login-wrap {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    .login-logo {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      text-align: center;
      margin-bottom: 8px;
    }

    .login-logo span { color: var(--accent); }

    .login-sub {
      text-align: center;
      color: var(--text2);
      font-size: 14px;
      margin-bottom: 36px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      animation: fadeUp 0.5s cubic-bezier(.4,0,.2,1) both;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: var(--bg3);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
    }

    .tab-btn {
      padding: 9px;
      border: none;
      background: transparent;
      color: var(--text2);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--surface2);
      color: var(--text);
    }

    .glow-line {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.6;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      opacity: 0.18;
    }

    .orb-1 {
      width: 400px; height: 400px;
      background: var(--accent);
      top: -100px; left: -100px;
    }

    .orb-2 {
      width: 300px; height: 300px;
      background: var(--accent2);
      bottom: -80px; right: -60px;
    }

    .demo-hint {
      margin-top: 20px;
      padding: 12px 16px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 12px;
      color: var(--text3);
      line-height: 1.7;
    }

    .demo-hint strong { color: var(--text2); }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="login-wrap">
    <div class="login-logo">Insta<span>Guard</span></div>
    <p class="login-sub">Content safety and feed management</p>

    <div class="login-card">
      <div style="position:relative">
        <div class="glow-line"></div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Log in</button>
        <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign up</button>
      </div>

      <!-- Login form -->
      <div id="form-login">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" id="login-email" type="email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" id="login-pass" type="password" placeholder="Enter password" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px" id="login-btn" onclick="doLogin()">
          Log in
        </button>

        <!-- Google Sign In -->
        <div style="margin-top: 16px; text-align: center; position: relative">
          <div style="border-top: 1px solid var(--border); margin: 16px 0"></div>
          <span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--surface); padding: 0 12px; font-size: 12px; color: var(--text3)">
            OR
          </span>
        </div>
        <button class="btn btn-secondary" style="width:100%;justify-content:center;margin-top:8px;display:flex;align-items:center;gap:8px" onclick="signInWithGoogle()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <!-- Signup form -->
      <div id="form-signup" style="display:none">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" id="signup-email" type="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" id="signup-pass" type="password" placeholder="Min. 8 characters">
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px" id="signup-btn" onclick="doSignup()">
          Create account
        </button>

        <!-- Google Sign In -->
        <div style="margin-top: 16px; text-align: center; position: relative">
          <div style="border-top: 1px solid var(--border); margin: 16px 0"></div>
          <span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--surface); padding: 0 12px; font-size: 12px; color: var(--text3)">
            OR
          </span>
        </div>
        <button class="btn btn-secondary" style="width:100%;justify-content:center;margin-top:8px;display:flex;align-items:center;gap:8px" onclick="signInWithGoogle()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script>
    // Redirect if already logged in
    if (getUser()) window.location.href = 'pages/dashboard.html';

    function switchTab(t) {
      document.getElementById('form-login').style.display  = t === 'login'  ? '' : 'none';
      document.getElementById('form-signup').style.display = t === 'signup' ? '' : 'none';
      document.getElementById('tab-login').classList.toggle('active',  t === 'login');
      document.getElementById('tab-signup').classList.toggle('active', t === 'signup');
    }

    async function doLogin() {
      const email = document.getElementById('login-email').value.trim();
      const pass  = document.getElementById('login-pass').value;
      if (!email || !pass) return toast('Please fill in all fields', 'error');

      const btn = document.getElementById('login-btn');
      btn.innerHTML = '<span class="spinner"></span> Logging in...';
      btn.disabled = true;

      try {
        const res = await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password: pass })
        });
        localStorage.setItem('ig_token', res.access_token);
        setUser(res.user);
        window.location.href = 'pages/dashboard.html';
      } catch(e) {
        toast(e.message, 'error');
        btn.innerHTML = 'Log in';
        btn.disabled = false;
      }
    }

    async function signInWithGoogle() {
      // Redirect to Supabase Google OAuth
      const supabaseUrl = 'https://mrbmrckpghhmuwdvaoxl.supabase.co';
      const redirectUrl = window.location.origin + '/pages/dashboard.html';
      window.location.href = `${supabaseUrl}/auth/v1/authorize?provider=google&redirect_to=${redirectUrl}`;
    }

    async function doSignup() {
      const email = document.getElementById('signup-email').value.trim();
      const pass  = document.getElementById('signup-pass').value;
      if (!email || !pass) return toast('Please fill in all fields', 'error');
      if (pass.length < 8) return toast('Password must be at least 8 characters', 'error');

      const btn = document.getElementById('signup-btn');
      btn.innerHTML = '<span class="spinner"></span> Creating...';
      btn.disabled = true;

      try {
        const res = await apiFetch('/auth/signup', {
          method: 'POST',
          body: JSON.stringify({ email, password: pass })
        });
        localStorage.setItem('ig_token', res.access_token);
        setUser(res.user);
        window.location.href = 'pages/dashboard.html';
      } catch(e) {
        toast(e.message, 'error');
        btn.innerHTML = 'Create account';
        btn.disabled = false;
      }
    }

    // Enter key support
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (document.getElementById('form-login').style.display !== 'none') doLogin();
      else doSignup();
    });
  </script>
</body>
</html>
